[project]
name = "caredesk"
version = "0.2.1"
description = "Administrative assistant for a fictional nursing home, built with LangGraph."
authors = [
    { name = "Rozi" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "chainlit>=2.12.0",
    "fastapi>=0.143.0",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "langchain-deepseek>=1.1.1",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=3.1.3",
    "psycopg[binary,pool]>=3.3.6",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.41.0",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph.templates.agent", "agent", "backend", "ui"]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"
"backend" = "src/backend"
"ui" = "src/ui"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"scripts/*" = ["T201"]
"evals/*" = ["T201"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "faker>=40.40.0",
    "httpx2>=2.13.1",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pypdf>=6.19.0",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]

# Chainlit's API is untyped; only the modules that call it may call untyped functions.
[[tool.mypy.overrides]]
module = ["ui.app", "ui.data_layer"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
# A deprecation inside traceloop, which Chainlit imports; not our code.
filterwarnings = ["ignore::DeprecationWarning:traceloop.*"]
